<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Escala Equipe Técnica - DESIL</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Tema Escuro (Padrão Mesa de Som / Neon) */
      --bg: #0b0d10;
      --card: #13171d;
      --border: #232a35;
      --text: #f1f5f9;
      --muted: #8b98a9;
      --pill-bg: #1a2029;
      --neon-primary: #00f5a0;
      --neon-primary-rgb: 0, 245, 160;
      --neon-cyan: #00d9f5;
      --neon-cyan-rgb: 0, 217, 245;
      --neon-gold: #ffbe0b;
      --neon-gold-rgb: 255, 190, 11;
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    @media (prefers-color-scheme: light) {
      :root {
        /* Tema Claro (Adaptado com Glow Suave) */
        --bg: #f1f5f9;
        --card: #ffffff;
        --border: #cbd5e1;
        --text: #0f172a;
        --muted: #64748b;
        --pill-bg: #f8fafc;
        --neon-primary: #059669;
        --neon-primary-rgb: 5, 150, 105;
        --neon-cyan: #0284c7;
        --neon-cyan-rgb: 2, 132, 199;
        --neon-gold: #d97706;
        --neon-gold-rgb: 217, 119, 6;
        --card-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 48px;
      transition: background 0.2s, color 0.2s;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-shadow: 0 0 14px rgba(var(--neon-cyan-rgb), 0.35);
    }
    .badge-live {
      font-size: 0.7rem;
      background: rgba(var(--neon-primary-rgb), 0.14);
      color: var(--neon-primary);
      border: 1px solid rgba(var(--neon-primary-rgb), 0.45);
      box-shadow: 0 0 10px rgba(var(--neon-primary-rgb), 0.3);
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 700;
    }

    .filter-box {
      background: var(--card);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--card-shadow);
      margin-bottom: 18px;
    }
    .filter-box label {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    select:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(var(--neon-cyan-rgb), 0.35);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
      position: relative;
      box-shadow: var(--card-shadow);
    }
    .card.highlight {
      border-color: rgba(var(--neon-primary-rgb), 0.55);
      box-shadow: 0 0 14px rgba(var(--neon-primary-rgb), 0.18);
    }

    /* Destaque Neon da Próxima Escala */
    .card.next-up {
      border: 1.5px solid var(--neon-gold);
      box-shadow: 0 0 20px rgba(var(--neon-gold-rgb), 0.28), inset 0 0 12px rgba(var(--neon-gold-rgb), 0.06);
    }
    .next-badge {
      display: inline-block;
      background: var(--neon-gold);
      color: #0b0d10;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      box-shadow: 0 0 12px rgba(var(--neon-gold-rgb), 0.55);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      gap: 8px;
    }
    .date-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px;
    }
    .date { font-size: 1.08rem; font-weight: 800; color: var(--text); }
    .weekday { font-size: 0.82rem; font-weight: 500; color: var(--muted); }
    .time { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .event-tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(var(--neon-cyan-rgb), 0.12);
      color: var(--neon-cyan);
      border: 1px solid rgba(var(--neon-cyan-rgb), 0.35);
      box-shadow: 0 0 8px rgba(var(--neon-cyan-rgb), 0.2);
      white-space: nowrap;
    }

    .info-banner {
      background: rgba(var(--neon-cyan-rgb), 0.05);
      border: 1px dashed rgba(var(--neon-cyan-rgb), 0.35);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 10px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text);
      line-height: 1.4;
    }

    .roles-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    /* Coordenador com Brilho Neon */
    .coord-box {
      grid-column: span 2;
      background: rgba(var(--neon-primary-rgb), 0.09);
      border: 1px solid rgba(var(--neon-primary-rgb), 0.45);
      box-shadow: 0 0 12px rgba(var(--neon-primary-rgb), 0.18);
      padding: 8px 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .coord-box .role-name { color: var(--neon-primary); font-size: 0.68rem; margin-bottom: 2px; font-weight: 700; }
    .coord-box .person-name { font-size: 0.96rem; font-weight: 800; letter-spacing: 0.02em; }

    .role-item {
      background: var(--pill-bg);
      border: 1px solid var(--border);
      padding: 7px 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
    }
    .role-item.active-me {
      border-color: rgba(var(--neon-primary-rgb), 0.6);
      box-shadow: 0 0 10px rgba(var(--neon-primary-rgb), 0.22);
    }
    .role-name { color: var(--muted); font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
    .person-name { font-weight: 600; color: var(--text); }
    .person-me {
      color: var(--neon-primary);
      font-weight: 800;
      text-shadow: 0 0 8px rgba(var(--neon-primary-rgb), 0.45);
    }

    .cal-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      margin-top: 12px;
      padding: 9px 12px;
      border-radius: 8px;
      background: rgba(var(--neon-cyan-rgb), 0.08);
      border: 1px solid rgba(var(--neon-cyan-rgb), 0.35);
      color: var(--neon-cyan);
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      transition: box-shadow 0.2s, background 0.2s;
    }
    .cal-btn:hover, .cal-btn:active {
      background: rgba(var(--neon-cyan-rgb), 0.16);
      box-shadow: 0 0 12px rgba(var(--neon-cyan-rgb), 0.35);
    }

    /* Seção de Calendários Mensais no Rodapé */
    .calendar-section {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .calendar-section-title {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--neon-primary);
      text-shadow: 0 0 10px rgba(var(--neon-primary-rgb), 0.3);
      margin-bottom: 14px;
      text-align: center;
    }
    .month-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--card-shadow);
    }
    .month-header {
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: capitalize;
      margin-bottom: 10px;
      color: var(--text);
    }
