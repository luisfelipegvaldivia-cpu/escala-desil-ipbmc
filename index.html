<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-512.png.jfif">
  <title>Escalas DESIL</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ===== TEMA ESCURO (padrão) ===== */
    :root {
      --bg: #0d0f12;
      --card: #171a1f;
      --border: #2a2e36;
      --text: #f1f3f5;
      --muted: #9aa0a6;
      --soft: rgba(255, 255, 255, 0.05);
      --soft-strong: rgba(255, 255, 255, 0.12);
      --pill-bg: #20242b;

      --accent: #00e394;
      --accent-rgb: 0, 227, 148;
      --gold: #ffc933;
      --gold-rgb: 255, 201, 51;
      --cyan: #3ad8ff;
      --cyan-rgb: 58, 216, 255;

      --glow-accent: 0 0 6px rgba(var(--accent-rgb), .7), 0 0 18px rgba(var(--accent-rgb), .35);
      --glow-gold: 0 0 6px rgba(var(--gold-rgb), .7), 0 0 20px rgba(var(--gold-rgb), .35);
      --glow-cyan: 0 0 6px rgba(var(--cyan-rgb), .6), 0 0 16px rgba(var(--cyan-rgb), .3);
      --text-glow-accent: 0 0 8px rgba(var(--accent-rgb), .75);
      --next-bg: linear-gradient(145deg, #231f12 0%, #171a1f 70%);
      --on-accent: #06130d;
    }

    /* ===== TEMA CLARO ===== */
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #eef1f5;
        --card: #ffffff;
        --border: #d5dae2;
        --text: #14171a;
        --muted: #5b626b;
        --soft: rgba(20, 23, 26, 0.04);
        --soft-strong: rgba(20, 23, 26, 0.09);
        --pill-bg: #eef1f5;

        --accent: #00a56e;
        --accent-rgb: 0, 165, 110;
        --gold: #c98a00;
        --gold-rgb: 214, 150, 0;
        --cyan: #0089b3;
        --cyan-rgb: 0, 137, 179;

        /* No claro o brilho é mais discreto para não borrar */
        --glow-accent: 0 0 5px rgba(var(--accent-rgb), .45), 0 0 14px rgba(var(--accent-rgb), .22);
        --glow-gold: 0 0 5px rgba(var(--gold-rgb), .45), 0 0 14px rgba(var(--gold-rgb), .22);
        --glow-cyan: 0 0 5px rgba(var(--cyan-rgb), .4), 0 0 12px rgba(var(--cyan-rgb), .2);
        --text-glow-accent: 0 0 6px rgba(var(--accent-rgb), .35);
        --next-bg: linear-gradient(145deg, #fff6dc 0%, #ffffff 70%);
        --on-accent: #ffffff;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; max-width: 600px; margin: 0 auto; padding-bottom: 40px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.02em; }
    .badge-live {
      font-size: 0.7rem; background: rgba(var(--accent-rgb), 0.12); color: var(--accent);
      border: 1px solid rgba(var(--accent-rgb), 0.55); padding: 4px 9px; border-radius: 99px; font-weight: 600;
      box-shadow: var(--glow-accent); text-shadow: var(--text-glow-accent);
    }
    .install-bar {
      display: none; background: var(--card); border: 1px solid var(--accent);
      box-shadow: var(--glow-accent); border-radius: 12px; padding: 10px 14px;
      margin-bottom: 16px; align-items: center; justify-content: space-between; gap: 10px;
      font-size: 0.8rem; color: var(--text);
    }
    .install-btn {
      background: var(--accent); color: var(--on-accent); border: none;
      padding: 7px 12px; border-radius: 8px; font-weight: 800; font-size: 0.78rem;
      cursor: pointer; white-space: nowrap; box-shadow: var(--glow-accent);
    }
    .filter-box { background: var(--card); padding: 12px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 18px; }
    .filter-box label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
    select { width: 100%; padding: 10px 12px; border-radius: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border); font-size: 0.95rem; outline: none; }
    select:focus { border-color: var(--accent); box-shadow: var(--glow-accent); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; position: relative; }
    .card.highlight { border-left: 4px solid var(--accent); }

    /* Destaque da Próxima Escala */
    .card.next-up {
      border: 1.5px solid var(--gold);
      background: var(--next-bg);
      box-shadow: var(--glow-gold);
    }
    .next-badge {
      display: inline-block; background: var(--gold); color: #121212;
      font-size: 0.65rem; font-weight: 800; padding: 3px 8px; border-radius: 6px;
      text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px;
      box-shadow: var(--glow-gold);
    }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 8px; }
    .date { font-size: 1.08rem; font-weight: 700; color: var(--text); }
    .weekday { font-size: 0.8rem; font-weight: 500; color: var(--muted); margin-left: 4px; }
    .time { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .event-tag {
      font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 99px; white-space: nowrap;
      background: rgba(var(--cyan-rgb), 0.1); color: var(--cyan);
      border: 1px solid rgba(var(--cyan-rgb), 0.55); box-shadow: var(--glow-cyan);
    }

    .info-banner {
      background: var(--soft); border: 1px dashed var(--border); border-radius: 8px;
      padding: 8px 12px; margin-bottom: 10px; text-align: center; font-size: 0.82rem; color: var(--text); line-height: 1.4;
    }

    .roles-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--border); }

    .coord-box {
      grid-column: span 2;
      background: rgba(var(--accent-rgb), 0.1);
      border: 1px solid rgba(var(--accent-rgb), 0.55);
      box-shadow: var(--glow-accent);
      padding: 8px 12px; border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    .coord-box .role-name { color: var(--accent); font-size: 0.68rem; margin-bottom: 2px; }
    .coord-box .person-name { font-size: 0.95rem; font-weight: 700; letter-spacing: 0.02em; }

    .role-item { background: var(--pill-bg); padding: 7px 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; border: 1px solid transparent; }
    .role-name { color: var(--muted); font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
    .person-name { font-weight: 600; color: var(--text); }
    .person-me { color: var(--accent); font-weight: 800; text-shadow: var(--text-glow-accent); }

    .cal-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
      margin-top: 12px; padding: 8px 12px; border-radius: 8px;
      background: var(--soft); border: 1px solid var(--border); color: var(--text);
      font-size: 0.78rem; font-weight: 600; text-decoration: none; transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .cal-btn:hover, .cal-btn:active { background: var(--soft-strong); border-color: var(--accent); box-shadow: var(--glow-accent); }

    .loading, .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 0.9rem; line-height: 1.5; }

    /* ===== CALENDÁRIOS DO INTEGRANTE ===== */
    .cal-section-title { font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; margin: 26px 0 10px; }
    .month-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    .month-name { font-size: 0.95rem; font-weight: 700; text-transform: capitalize; margin-bottom: 10px; }
    .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .dow { text-align: center; font-size: 0.65rem; font-weight: 600; color: var(--muted); padding-bottom: 2px; }
    .day {
      aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 500; color: var(--muted); border-radius: 8px; border: 1px solid transparent;
    }
    .day.today { border-color: var(--muted); color: var(--text); }
    .day.on {
      background: rgba(var(--accent-rgb), 0.16); color: var(--accent); font-weight: 800;
      border-color: var(--accent); box-shadow: var(--glow-accent); text-shadow: var(--text-glow-accent);
      cursor: pointer;
    }
    .day.on.next { background: rgba(var(--gold-rgb), 0.18); color: var(--gold); border-color: var(--gold); box-shadow: var(--glow-gold); text-shadow: none; }
    .legend { display: flex; gap: 14px; font-size: 0.7rem; color: var(--muted); margin-top: 10px; }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    .legend .l-on { background: var(--accent); box-shadow: var(--glow-accent); }
    .legend .l-next { background: var(--gold); box-shadow: var(--glow-gold); }

    /* ===== CONFIRMAÇÃO DE PRESENÇA ===== */
    .chk { color: var(--accent); font-weight: 800; margin-left: 6px; text-shadow: var(--text-glow-accent); }
    .confirm-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      margin-top: 12px; padding: 10px 12px; border-radius: 8px; cursor: pointer;
      background: rgba(var(--gold-rgb), 0.14); border: 1px solid var(--gold); color: var(--gold);
      font-size: 0.82rem; font-weight: 700; box-shadow: var(--glow-gold);
    }
    .confirm-count { background: var(--gold); color: #121212; border-radius: 99px; padding: 1px 8px; font-size: 0.72rem; font-weight: 800; }

    .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .modal[hidden] { display: none; }
    .modal-card {
      position: relative; width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto;
      background: var(--card); border: 1px solid var(--gold); border-radius: 16px; padding: 18px; box-shadow: var(--glow-gold);
    }
    .modal-card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 12px; padding-right: 28px; }
    .modal-close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: var(--muted); font-size: 1.6rem; line-height: 1; cursor: pointer; }
    .confirm-list { list-style: none; margin-bottom: 14px; }
    .confirm-list li { display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 8px; background: var(--pill-bg); margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; }
    .confirm-list .st { font-weight: 500; color: var(--muted); }
    .confirm-list li.ok .st { color: var(--accent); text-shadow: var(--text-glow-accent); }
    .modal-card label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
    .confirm-submit {
      width: 100%; margin-top: 10px; padding: 11px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 800;
      background: var(--accent); color: var(--on-accent); border: none; box-shadow: var(--glow-accent);
    }
    .confirm-submit:disabled { opacity: 0.6; }
    .confirm-msg { margin-top: 10px; font-size: 0.82rem; color: var(--muted); text-align: center; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Escalas DESIL</h1>
    </div>
    <span class="badge-live">● Sincronizado</span>
  </header>

  <div id="installBar" class="install-bar">
    <span>📲 Instale o app na tela inicial para acesso rápido</span>
    <button id="installBtn" class="install-btn" type="button">Instalar</button>
  </div>
  
  <div class="filter-box">
    <label for="memberFilter">Filtrar por integrante</label>
    <select id="memberFilter">
      <option value="TODOS">Todos os integrantes (Escala Geral)</option>
    </select>
  </div>

  <div id="scheduleList" class="loading">Carregando escalas...</div>
  <div id="memberCalendars"></div>

  <div id="confirmModal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <button class="modal-close" type="button" data-close-modal aria-label="Fechar">×</button>
      <h2 id="confirmTitle">Confirmações</h2>
      <div id="confirmBody"></div>
    </div>
  </div>

  <script>
    const BASE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSXiQUm_GcKyup0R2ksKynxi-j7H9MHTCRqodZnsG8ImN0pdZva9c0VWvUHgUKRF1YWN3tswiZW_bmX/pub?gid=0&single=true&output=csv";
    const TARGET_ROLES = ["COORDENADOR", "PC", "YAMAHA", "CORTEX", "BERINGHER"];
    const WEEKDAYS = ["domingo", "segunda-feira", "terça-feira", "quarta-feira", "quinta-feira", "sexta-feira", "sábado"];
    const WEEKDAYS_SHORT = ["D", "S", "T", "Q", "Q", "S", "S"];
    let allRows = [];
    let activeRoleHeaders = [];

    // Cole aqui a URL do Apps Script (termina em /exec). Vazio = confirmações desligadas.
    const CONFIRM_URL = "https://script.google.com/macros/s/AKfycbz0SzAhkWcwH2K-0cfhl-e67W5jRCvHE6upLNK_GkR3WOlwVCKp3lG_3BRtVp8lKmtl/exec";
    let confirmations = [];
    let nextInfo = null;

// ===== INSTALAÇÃO PWA (Android + iOS) =====
    let deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById("installBar").style.display = "flex";
    });

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
    if (isIOS && !isStandalone) {
      const bar = document.getElementById("installBar");
      bar.style.display = "flex";
      bar.innerHTML = `<span>📲 No iPhone: toque em <b>Compartilhar</b> (□↑) e depois em <b>Adicionar à Tela de Início</b>.</span>`;
    }

    document.getElementById("installBtn").addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById("installBar").style.display = "none";
    });
    
    function parseCSVLine(line) {
      const result = [];
      let current = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = "";
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result;
    }

    function parseCSV(text) {
      const cleanText = text.replace(/^\uFEFF/, "").trim();
      const lines = cleanText.split(/\r?\n/);
      if (lines.length < 2) return [];
      const rawHeaders = parseCSVLine(lines[0]).map(h => h.trim());

      activeRoleHeaders = [];
      TARGET_ROLES.forEach(target => {
        const found = rawHeaders.find(h => h.toUpperCase() === target);
        if (found) activeRoleHeaders.push(found);
      });

      return lines.slice(1).map(line => {
        const values = parseCSVLine(line);
        const obj = { _raw: {} };
        rawHeaders.forEach((h, i) => {
          const val = (values[i] || "").trim();
          obj[h.toUpperCase()] = val;
          obj._raw[h] = val;
        });
        return obj;
      });
    }

    // Retorna { y, m, d } (m de 1 a 12) ou null
    function parseBRParts(dateStr) {
      if (!dateStr) return null;
      const parts = dateStr.split("/");
      if (parts.length !== 3) return null;
      let y = Number(parts[2]);
      if (y < 100) y += 2000;
      const m = Number(parts[1]);
      const d = Number(parts[0]);
      if (!y || !m || !d) return null;
      return { y, m, d };
    }

    function parseBRDate(dateStr) {
      const p = parseBRParts(dateStr);
      return p ? new Date(p.y, p.m - 1, p.d, 23, 59, 59) : null;
    }

    function weekdayName(dateStr) {
      const p = parseBRParts(dateStr);
      return p ? WEEKDAYS[new Date(p.y, p.m - 1, p.d).getDay()] : "";
    }

    function dayKey(p) { return `${p.y}-${p.m}-${p.d}`; }

    function formatYYYYMMDD(dateObj) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, "0");
      const dd = String(dateObj.getDate()).padStart(2, "0");
      return `${yyyy}${mm}${dd}`;
    }

    function buildGoogleCalendarLink(row, rowRoles) {
      const title = encodeURIComponent("Escala DESIL");
      const parts = (row["DATA"] || "").split("/");
      let datesParam = "";

      if (parts.length === 3) {
        const startDate = new Date(Number(parts[2]), Number(parts[1]) - 1, Number(parts[0]));
        const endDate = new Date(startDate);
        endDate.setDate(endDate.getDate() + 1);
        datesParam = `&dates=${formatYYYYMMDD(startDate)}/${formatYYYYMMDD(endDate)}`;
      }

      const eventoNome = row["EVENTO"] || "";
      const info = row["INFORMAÇÕES"] || row["INFORMACOES"] || row["INFORMAÇÃO"] || row["INFORMACAO"] || row["OBS"] || "";
      const teamText = rowRoles.map(r => `${r}: ${row._raw[r]}`).join("\n");

      let detailsParts = [];
      if (eventoNome) detailsParts.push(`Evento: ${eventoNome}`);
      if (info) detailsParts.push(`Observações: ${info}`);
      detailsParts.push(`Escalação:\n${teamText}`);

      const details = encodeURIComponent(detailsParts.join("\n\n"));

      return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}${datesParam}&details=${details}`;
    }

    function populateFilter(rows) {
      const names = new Set();
      rows.forEach(r => {
        activeRoleHeaders.forEach(role => {
          if (r._raw[role]) names.add(r._raw[role]);
        });
      });

      const select = document.getElementById("memberFilter");
      const sortedNames = Array.from(names).sort((a, b) => a.localeCompare(b, 'pt-BR', { sensitivity: 'base' }));

      sortedNames.forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });

      const saved = localStorage.getItem("selectedMember");
      if (saved && sortedNames.includes(saved)) {
        select.value = saved;
      }

      select.addEventListener("change", (e) => {
        localStorage.setItem("selectedMember", e.target.value);
        render(e.target.value);
      });
    }

    // Calendários mensais do integrante selecionado
    function renderMemberCalendars(memberRows, filterName, nextRow) {
      const box = document.getElementById("memberCalendars");
      if (filterName === "TODOS" || !memberRows.length) {
        box.innerHTML = "";
        return;
      }

      const scheduled = {};   // chave do dia -> id do card
      const months = new Map(); // "y-m" -> { y, m }
      memberRows.forEach(row => {
        const p = parseBRParts(row["DATA"]);
        if (!p) return;
        scheduled[dayKey(p)] = p.y * 10000 + p.m * 100 + p.d;
        months.set(`${p.y}-${p.m}`, { y: p.y, m: p.m });
      });

      const nextParts = nextRow ? parseBRParts(nextRow["DATA"]) : null;
      const nextKey = nextParts ? dayKey(nextParts) : null;
      const t = new Date();
      const todayKey = dayKey({ y: t.getFullYear(), m: t.getMonth() + 1, d: t.getDate() });

      const sorted = Array.from(months.values()).sort((a, b) => (a.y - b.y) || (a.m - b.m));

      const html = sorted.map(({ y, m }) => {
        const firstDow = new Date(y, m - 1, 1).getDay();
        const daysInMonth = new Date(y, m, 0).getDate();
        const monthLabel = new Date(y, m - 1, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });

        let cells = WEEKDAYS_SHORT.map(l => `<div class="dow">${l}</div>`).join("");
        for (let i = 0; i < firstDow; i++) cells += `<div></div>`;
        for (let d = 1; d <= daysInMonth; d++) {
          const key = dayKey({ y, m, d });
          const on = scheduled[key];
          const cls = ["day", on ? "on" : "", key === nextKey ? "next" : "", key === todayKey ? "today" : ""].filter(Boolean).join(" ");
          cells += on
            ? `<div class="${cls}" data-card="d-${on}" title="Dia de escala">${d}</div>`
            : `<div class="${cls}">${d}</div>`;
        }
        return `<div class="month-card"><div class="month-name">${monthLabel}</div><div class="month-grid">${cells}</div></div>`;
      }).join("");

      box.innerHTML = `
        <div class="cal-section-title">Calendário de ${filterName}</div>
        ${html}
        <div class="legend"><span><i class="l-on"></i>Dia de escala</span><span><i class="l-next"></i>Próxima escala</span></div>
      `;
    }

    function keyOf(row) { return `${row["DATA"] || ""}|${row["EVENTO"] || ""}`; }
    function isConfirmed(key, name) { return confirmations.some(c => c.chave === key && c.nome === name); }
    function currentFilter() { return document.getElementById("memberFilter").value; }

    function loadConfirmations() {
      return fetch(`${CONFIRM_URL}?t=${Date.now()}`)
        .then(r => r.json())
        .then(data => {
          if (Array.isArray(data)) {
            confirmations = data;
            render(currentFilter());
            refreshModal();
          }
        })
        .catch(() => {});
    }

    function openConfirmModal() {
      if (!nextInfo) return;
      document.getElementById("confirmModal").hidden = false;
      document.body.style.overflow = "hidden";
      refreshModal();
    }

    function closeConfirmModal() {
      document.getElementById("confirmModal").hidden = true;
      document.body.style.overflow = "";
    }

    function refreshModal() {
      const modal = document.getElementById("confirmModal");
      if (modal.hidden || !nextInfo) return;
      const { key, people, date } = nextInfo;
      const wd = weekdayName(date);
      document.getElementById("confirmTitle").textContent = `Escala de ${date}${wd ? " " + wd : ""}`;

      const items = people.map(p => {
        const c = confirmations.find(c => c.chave === key && c.nome === p);
        const when = c && c.em ? new Date(c.em).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
        return `<li class="${c ? "ok" : ""}"><span>${p}</span><span class="st">${c ? "✓ " + when : "Pendente"}</span></li>`;
      }).join("");

      const pending = people.filter(p => !isConfirmed(key, p));
      const sel = currentFilter();
      const form = pending.length
        ? `<label for="confirmName">Quem está confirmando?</label>
           <select id="confirmName">${pending.map(p => `<option value="${p}" ${p === sel ? "selected" : ""}>${p}</option>`).join("")}</select>
           <button type="button" class="confirm-submit" id="confirmSubmit">Confirmar que vi a escala</button>
           <div class="confirm-msg" id="confirmMsg"></div>`
        : `<div class="confirm-msg">Todos já confirmaram. 🎉</div>`;

      document.getElementById("confirmBody").innerHTML = `<ul class="confirm-list">${items}</ul>${form}`;
    }

    function submitConfirm() {
      const name = document.getElementById("confirmName").value;
      const btn = document.getElementById("confirmSubmit");
      const msg = document.getElementById("confirmMsg");
      btn.disabled = true;
      btn.textContent = "Enviando...";
      fetch(`${CONFIRM_URL}?action=confirm&chave=${encodeURIComponent(nextInfo.key)}&nome=${encodeURIComponent(name)}`)
        .then(r => r.json())
        .then(data => {
          if (!Array.isArray(data)) throw new Error("resposta inválida");
          confirmations = data;
          render(currentFilter());
          refreshModal();
        })
        .catch(() => {
          btn.disabled = false;
          btn.textContent = "Confirmar que vi a escala";
          msg.textContent = "Não foi possível confirmar. Tente de novo.";
        });
    }

    document.addEventListener("click", (e) => {
      if (e.target.closest("[data-open-confirm]")) openConfirmModal();
      else if (e.target.closest("[data-close-modal]") || e.target.id === "confirmModal") closeConfirmModal();
      else if (e.target.id === "confirmSubmit") submitConfirm();
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeConfirmModal(); });

    function render(filterName) {
      const container = document.getElementById("scheduleList");
      const filtered = filterName === "TODOS"
        ? allRows
        : allRows.filter(r => activeRoleHeaders.some(role => r._raw[role] === filterName));

      if (!filtered.length) {
        container.className = "";
        container.innerHTML = `<div class="empty">Nenhuma escala encontrada.<br><small>Verifique se o link publicado aponta para a aba <b>Escalas</b>.</small></div>`;
        renderMemberCalendars([], filterName, null);
        return;
      }

      nextInfo = null;
      const now = new Date();
      let nextIndex = -1;
      let minDiff = Infinity;
      filtered.forEach((row, idx) => {
        const d = parseBRDate(row["DATA"]);
        if (d && d >= now) {
          const diff = d - now;
          if (diff < minDiff) {
            minDiff = diff;
            nextIndex = idx;
          }
        }
      });

      container.className = "";
      container.innerHTML = filtered.map((row, idx) => {
        const isNext = idx === nextIndex;
        const rowKey = keyOf(row);
        const people = [...new Set(activeRoleHeaders.map(r => row._raw[r]).filter(Boolean))];
        if (isNext) nextInfo = { key: rowKey, people, date: row["DATA"] || "" };
        const mark = (person) => (isNext && CONFIRM_URL && isConfirmed(rowKey, person)) ? '<span class="chk" title="Confirmou">✓</span>' : "";
        const nConf = people.filter(p => isConfirmed(rowKey, p)).length;
        const confirmBtn = (isNext && CONFIRM_URL)
          ? `<button type="button" class="confirm-btn" data-open-confirm>✔ Confirmar presença <span class="confirm-count">${nConf}/${people.length}</span></button>`
          : "";
        const rowRoles = activeRoleHeaders.filter(role => row._raw[role]);
        const isUserScheduled = filterName !== "TODOS" && rowRoles.some(r => row._raw[r] === filterName);

        const coordCol = rowRoles.find(r => r.toUpperCase() === "COORDENADOR");
        const otherRoles = rowRoles.filter(r => r.toUpperCase() !== "COORDENADOR");

        let rolesHTML = "";
        if (coordCol) {
          const coordPerson = row._raw[coordCol];
          const isMe = coordPerson === filterName;
          rolesHTML += `
            <div class="coord-box">
              <span class="role-name">${coordCol}</span>
              <span class="${isMe ? 'person-me' : 'person-name'}">${coordPerson}${mark(coordPerson)}</span>
            </div>
          `;
        }

        rolesHTML += otherRoles.map(role => {
          const person = row._raw[role];
          const isMe = person === filterName;
          return `<div class="role-item">
            <span class="role-name">${role}</span>
            <span class="${isMe ? 'person-me' : 'person-name'}">${person}${mark(person)}</span>
          </div>`;
        }).join("");

        const horaIni = row["HORA_INICIO"] || row["HORA INICIO"] || "";
        const horaFim = row["HORA_FIM"] || row["HORA FIM"] || "";
        const infoText = row["INFORMAÇÕES"] || row["INFORMACOES"] || row["INFORMAÇÃO"] || row["INFORMACAO"] || row["OBS"] || "";
        const calLink = buildGoogleCalendarLink(row, rowRoles);

        const p = parseBRParts(row["DATA"]);
        const cardId = p ? `d-${p.y * 10000 + p.m * 100 + p.d}` : "";
        const wd = weekdayName(row["DATA"]);

        return `
          <div class="card ${isNext ? 'next-up' : (isUserScheduled ? 'highlight' : '')}" ${cardId ? `id="${cardId}"` : ""}>
            ${isNext ? '<div class="next-badge">★ Próxima Escala</div>' : ''}
            <div class="card-top">
              <div>
                <div class="date">${row["DATA"] || ""}${wd ? `<span class="weekday">${wd}</span>` : ""}</div>
                <div class="time">${horaIni} ${horaFim ? 'às ' + horaFim : ''}</div>
              </div>
              <span class="event-tag">${row["EVENTO"] || "Culto"}</span>
            </div>
            ${infoText ? `<div class="info-banner">${infoText}</div>` : ''}
            <div class="roles-grid">${rolesHTML}</div>
            ${confirmBtn}
            <a href="${calLink}" target="_blank" rel="noopener" class="cal-btn">
              📅 Adicionar ao Google Agenda
            </a>
          </div>
        `;
      }).join("");

      renderMemberCalendars(filtered, filterName, nextIndex >= 0 ? filtered[nextIndex] : null);
    }

    // Toque num dia de escala do calendário rola até o card correspondente
    document.getElementById("memberCalendars").addEventListener("click", (e) => {
      const cell = e.target.closest(".day.on");
      if (!cell) return;
      const card = document.getElementById(cell.dataset.card);
      if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });
    });

    fetch(`${BASE_CSV_URL}&t=${Date.now()}`)
      .then(res => res.text())
      .then(csv => {
        const parsed = parseCSV(csv);
        allRows = parsed.filter(r => r["DATA"]);
        populateFilter(allRows);
        render(document.getElementById("memberFilter").value);
        if (CONFIRM_URL) loadConfirmations();
      })
      .catch(() => {
        document.getElementById("scheduleList").innerHTML =
          `<div class="empty">Erro ao carregar planilha. Verifique o link CSV.</div>`;
      });
  </script>
</body>
</html>
