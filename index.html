<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#041812">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-512.png">
  <title>Escalas DESIL - IPBMC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef2f5;
      --surface: #ffffff;
      --surface-soft: #f1f5f8;
      --border: #dce3ea;
      --text: #111827;
      --muted: #64748b;

      --header-grad: linear-gradient(135deg, #041812 0%, #0a2e22 100%);
      --accent: #0d6e46;
      --accent-soft: #dcf2e7;
      --accent-border: #6ec49e;

      --gold: #d97706;
      --gold-card-bg: linear-gradient(180deg, #fffdf7 0%, #fff6e0 100%);
      --gold-border: #f3c667;
      --gold-pill: #fde68a;

      --cyan: #0284c7;
      --cyan-soft: #e0f2fe;
      --cyan-border: #bae6fd;

      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.07);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0e11;
        --surface: #14191f;
        --surface-soft: #1c232b;
        --border: #27303b;
        --text: #f3f4f6;
        --muted: #94a3b8;

        --header-grad: linear-gradient(135deg, #03120d 0%, #08261c 100%);
        --accent: #18b874;
        --accent-soft: rgba(24, 184, 116, 0.14);
        --accent-border: rgba(24, 184, 116, 0.42);

        --gold: #fbbf24;
        --gold-card-bg: linear-gradient(180deg, #1f1c14 0%, #14191f 100%);
        --gold-border: rgba(251, 191, 36, 0.6);
        --gold-pill: rgba(251, 191, 36, 0.22);

        --cyan: #38bdf8;
        --cyan-soft: rgba(56, 189, 248, 0.14);
        --cyan-border: rgba(56, 189, 248, 0.4);

        --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.32);
        --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.45);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); max-width: 540px; margin: 0 auto; padding-bottom: 40px; min-height: 100vh; }

    .app-header {
      background: var(--header-grad);
      color: #ffffff;
      padding: 18px 18px 0 18px;
      border-bottom-left-radius: 22px;
      border-bottom-right-radius: 22px;
      box-shadow: var(--shadow-md);
      margin-bottom: 16px;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .wave-icon { display: flex; align-items: center; gap: 3px; height: 26px; }
    .wave-icon span { display: block; width: 3.5px; background: #26b879; border-radius: 99px; box-shadow: 0 0 6px rgba(38, 184, 121, 0.45); }
    .wave-icon span:nth-child(1) { height: 10px; }
    .wave-icon span:nth-child(2) { height: 18px; }
    .wave-icon span:nth-child(3) { height: 26px; }
    .wave-icon span:nth-child(4) { height: 15px; }
    .wave-icon span:nth-child(5) { height: 21px; }
    .wave-icon span:nth-child(6) { height: 11px; }

    .brand-text h1 { font-size: 1.22rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
    .brand-text small { font-size: 0.72rem; font-weight: 600; color: rgba(255, 255, 255, 0.72); letter-spacing: 0.08em; display: block; margin-top: 2px; }

    .bell-btn {
      position: relative; width: 40px; height: 40px; border-radius: 12px;
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .bell-dot {
      position: absolute; top: 8px; right: 9px; width: 8px; height: 8px;
      background: #fbbf24; border-radius: 50%; box-shadow: 0 0 8px #fbbf24;
    }

    .top-tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 0 2px; }
    .top-tab {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      padding: 11px 8px; border: none; background: transparent;
      color: rgba(255, 255, 255, 0.75); font-size: 0.85rem; font-weight: 600;
      border-top-left-radius: 14px; border-top-right-radius: 14px; cursor: pointer; transition: 0.15s;
    }
    .top-tab svg { width: 16px; height: 16px; stroke: currentColor; }
    .top-tab.active { background: var(--bg); color: var(--text); font-weight: 700; }
    .top-tab.active svg { stroke: var(--accent); }

    .container { padding: 0 14px; }

    .filter-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 12px 14px; margin-bottom: 14px; box-shadow: var(--shadow-sm);
    }
    .filter-label { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
    .filter-label svg { width: 15px; height: 15px; stroke: var(--accent); }
    select {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      background: var(--surface-soft); color: var(--text); border: 1px solid var(--border);
      font-size: 0.9rem; font-weight: 600; outline: none;
    }

    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
      padding: 15px; margin-bottom: 14px; box-shadow: var(--shadow-sm);
    }
