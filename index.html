<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#041812">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-512.png">
  <title>Escalas DESIL - IPBMC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef2f5;
      --surface: #ffffff;
      --surface-soft: #f1f5f8;
      --border: #dce3ea;
      --text: #111827;
      --muted: #64748b;

      --header-grad: linear-gradient(135deg, #041812 0%, #0a2e22 100%);
      --accent: #0d6e46;
      --accent-soft: #dcf2e7;
      --accent-border: #6ec49e;

      --gold: #d97706;
      --gold-card-bg: linear-gradient(180deg, #fffdf7 0%, #fff6e0 100%);
      --gold-border: #f3c667;
      --gold-pill: #fde68a;

      --cyan: #0284c7;
      --cyan-soft: #e0f2fe;
      --cyan-border: #bae6fd;

      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.07);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0e11;
        --surface: #14191f;
        --surface-soft: #1c232b;
        --border: #27303b;
        --text: #f3f4f6;
        --muted: #94a3b8;

        --header-grad: linear-gradient(135deg, #03120d 0%, #08261c 100%);
        --accent: #18b874;
        --accent-soft: rgba(24, 184, 116, 0.14);
        --accent-border: rgba(24, 184, 116, 0.42);

        --gold: #fbbf24;
        --gold-card-bg: linear-gradient(180deg, #1f1c14 0%, #14191f 100%);
        --gold-border: rgba(251, 191, 36, 0.6);
        --gold-pill: rgba(251, 191, 36, 0.22);

        --cyan: #38bdf8;
        --cyan-soft: rgba(56, 189, 248, 0.14);
        --cyan-border: rgba(56, 189, 248, 0.4);

        --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.32);
        --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.45);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); max-width: 540px; margin: 0 auto; padding-bottom: 40px; min-height: 100vh; }

    .app-header {
      background: var(--header-grad);
      color: #ffffff;
      padding: 18px 18px 0 18px;
      border-bottom-left-radius: 22px;
      border-bottom-right-radius: 22px;
      box-shadow: var(--shadow-md);
      margin-bottom: 16px;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .wave-icon { display: flex; align-items: center; gap: 3px; height: 26px; }
    .wave-icon span { display: block; width: 3.5px; background: #26b879; border-radius: 99px; box-shadow: 0 0 6px rgba(38, 184, 121, 0.45); }
    .wave-icon span:nth-child(1) { height: 10px; }
    .wave-icon span:nth-child(2) { height: 18px; }
    .wave-icon span:nth-child(3) { height: 26px; }
    .wave-icon span:nth-child(4) { height: 15px; }
    .wave-icon span:nth-child(5) { height: 21px; }
    .wave-icon span:nth-child(6) { height: 11px; }

    .brand-text h1 { font-size: 1.22rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
    .brand-text small { font-size: 0.72rem; font-weight: 600; color: rgba(255, 255, 255, 0.72); letter-spacing: 0.08em; display: block; margin-top: 2px; }

    .bell-btn {
      position: relative; width: 40px; height: 40px; border-radius: 12px;
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .bell-dot {
      position: absolute; top: 8px; right: 9px; width: 8px; height: 8px;
      background: #fbbf24; border-radius: 50%; box-shadow: 0 0 8px #fbbf24;
    }

    .top-tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 0 2px; }
    .top-tab {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      padding: 11px 8px; border: none; background: transparent;
      color: rgba(255, 255, 255, 0.75); font-size: 0.85rem; font-weight: 600;
      border-top-left-radius: 14px; border-top-right-radius: 14px; cursor: pointer; transition: 0.15s;
    }
    .top-tab svg { width: 16px; height: 16px; stroke: currentColor; }
    .top-tab.active { background: var(--bg); color: var(--text); font-weight: 700; }
    .top-tab.active svg { stroke: var(--accent); }

    .container { padding: 0 14px; }

    .filter-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 12px 14px; margin-bottom: 14px; box-shadow: var(--shadow-sm);
    }
    .filter-label { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
    .filter-label svg { width: 15px; height: 15px; stroke: var(--accent); }
    select {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      background: var(--surface-soft); color: var(--text); border: 1px solid var(--border);
      font-size: 0.9rem; font-weight: 600; outline: none;
    }

    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
      padding: 15px; margin-bottom: 14px; box-shadow: var(--shadow-sm);
    }
    .card.next-up {
      background: var(--gold-card-bg);
      border: 1.5px solid var(--gold-border);
      box-shadow: var(--shadow-md);
    }
    .card.highlight { border-left: 4px solid var(--accent); }

    .card-badges { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
    .next-pill {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--gold-pill); color: #78350f;
      font-size: 0.7rem; font-weight: 800; padding: 4px 10px; border-radius: 99px;
    }
    @media (prefers-color-scheme: dark) { .next-pill { color: #fde68a; } }

    .event-pill {
      font-size: 0.72rem; font-weight: 700; padding: 4px 11px; border-radius: 99px;
      background: var(--cyan-soft); color: var(--cyan); border: 1px solid var(--cyan-border);
    }

    .card-date-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
    .date-main { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .date-main svg { width: 18px; height: 18px; stroke: var(--accent); flex-shrink: 0; }
    .date-str { font-size: 1.12rem; font-weight: 800; }
    .weekday-str { font-size: 0.85rem; color: var(--muted); font-weight: 500; }
    .weekday-sub { font-size: 0.8rem; color: var(--muted); margin-left: 26px; margin-top: 2px; }

    .info-strip {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      background: rgba(148, 163, 184, 0.12); border-radius: 10px;
      padding: 8px 12px; margin-bottom: 12px; font-size: 0.8rem; font-weight: 600; color: var(--text);
    }
    .info-strip svg { width: 15px; height: 15px; stroke: var(--muted); flex-shrink: 0; }

    .coord-banner {
      background: var(--accent-soft); border: 1px solid var(--accent-border);
      border-radius: 12px; padding: 10px 14px; margin-bottom: 10px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    .coord-banner small { display: block; font-size: 0.68rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; }
    .coord-banner strong { font-size: 1rem; font-weight: 800; letter-spacing: 0.02em; }

    .roles-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .role-tile {
      background: var(--surface-soft); border: 1px solid var(--border);
      border-radius: 11px; padding: 9px 10px; display: flex; align-items: center; gap: 9px;
    }
    .role-tile.me { border-color: var(--accent); background: var(--accent-soft); }
    .role-tile svg { width: 18px; height: 18px; stroke: var(--muted); flex-shrink: 0; }
    .role-tile.me svg { stroke: var(--accent); }
    .role-tile-text small { display: block; font-size: 0.64rem; font-weight: 700; color: var(--muted); text-transform: uppercase; }
    .role-tile-text strong { font-size: 0.84rem; font-weight: 800; display: block; }
    .role-tile.me .role-tile-text strong { color: var(--accent); }

    .single-role-row {
      background: var(--surface-soft); border-radius: 11px; padding: 10px 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .single-role-left { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; }
    .single-role-left svg { width: 16px; height: 16px; stroke: var(--muted); }

    .confirm-btn {
      width: 100%; margin-top: 12px; padding: 11px; border-radius: 11px;
      background: var(--gold-pill); border: 1px solid var(--gold-border);
      color: #78350f; font-size: 0.85rem; font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    }
    @media (prefers-color-scheme: dark) { .confirm-btn { color: #fde68a; } }
    .count-badge {
      background: #d97706; color: #fff; font-size: 0.72rem; font-weight: 800;
      padding: 2px 8px; border-radius: 99px;
    }

    .gcal-btn {
      width: 100%; margin-top: 8px; padding: 10px; border-radius: 11px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-size: 0.83rem; font-weight: 700; text-decoration: none;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    .cal-section-title { font-size: 0.78rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 24px 0 10px; }
    .month-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
    .month-name { font-size: 0.95rem; font-weight: 800; text-transform: capitalize; margin-bottom: 10px; }
    .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .dow { text-align: center; font-size: 0.66rem; font-weight: 700; color: var(--muted); padding-bottom: 4px; }
    .day {
      aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
      font-size: 0.82rem; font-weight: 600; color: var(--muted); border-radius: 9px; border: 1px solid transparent;
    }
    .day.today { border-color: var(--muted); color: var(--text); }
    .day.on {
      background: var(--accent-soft); color: var(--accent); font-weight: 800;
      border-color: var(--accent-border); cursor: pointer;
    }
    .day.on.next {
      background: var(--gold-pill); color: #78350f; border-color: var(--gold-border);
    }
    @media (prefers-color-scheme: dark) {
      .day.on.next { color: #fde68a; }
    }
    .legend { display: flex; gap: 14px; font-size: 0.72rem; font-weight: 600; color: var(--muted); margin-top: 10px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    .legend .l-on { background: var(--accent); }
    .legend .l-next { background: var(--gold); }

    .section-heading { display: flex; align-items: center; gap: 8px; font-size: 0.96rem; font-weight: 800; margin-bottom: 12px; }
    .section-heading svg { width: 18px; height: 18px; stroke: var(--accent); }
    .member-row {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 13px 15px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; box-shadow: var(--shadow-sm);
    }
    .member-row strong { font-size: 0.92rem; }
    .member-badge { background: var(--accent-soft); color: var(--accent); font-size: 0.74rem; font-weight: 800; padding: 4px 10px; border-radius: 99px; }

    .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 60; }
    .modal[hidden] { display: none; }
    .modal-card {
      position: relative; width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto;
      background: var(--surface); border: 1px solid var(--gold-border); border-radius: 18px; padding: 18px; box-shadow: var(--shadow-md);
    }
    .modal-card h2 { font-size: 1rem; font-weight: 800; margin-bottom: 12px; padding-right: 28px; }
    .modal-close { position: absolute; top: 10px; right: 14px; background: none; border: none; color: var(--muted); font-size: 1.6rem; cursor: pointer; }
    .confirm-list { list-style: none; margin-bottom: 14px; }
    .confirm-list li { display: flex; justify-content: space-between; padding: 8px 10px; border-radius: 10px; background: var(--surface-soft); margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; }
    .confirm-list li.ok span:last-child { color: var(--accent); font-weight: 700; }
    .confirm-submit {
      width: 100%; margin-top: 10px; padding: 12px; border-radius: 10px; border: none;
      background: var(--accent); color: #fff; font-size: 0.9rem; font-weight: 800; cursor: pointer;
    }
    .chk { color: var(--accent); font-weight: 900; margin-left: 4px; }
    .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div class="brand">
        <div class="wave-icon" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="brand-text">
          <h1>Escalas DESIL</h1>
          <small>IPBMC</small>
        </div>
      </div>
      <button type="button" class="bell-btn" data-open-confirm aria-label="Confirmações">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="bell-dot" id="bellDot"></span>
      </button>
    </div>

    <div class="top-tabs">
      <button type="button" class="top-tab active" data-tab="escalas">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Escalas
      </button>
      <button type="button" class="top-tab" data-tab="integrantes">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Integrantes
      </button>
    </div>
  </header>

  <main class="container">
    <section id="view-escalas">
      <div class="filter-card">
        <div class="filter-label">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          Integrante
        </div>
        <select id="memberFilter">
          <option value="TODOS">Todos os integrantes (Escala Geral)</option>
        </select>
      </div>
      <div id="scheduleList" class="empty">Carregando escalas...</div>
      <div id="memberCalendars"></div>
    </section>

    <section id="view-integrantes" hidden>
      <div class="section-heading">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        Equipe Técnica DESIL
      </div>
      <div id="membersDirectory"></div>
    </section>
  </main>

  <div id="confirmModal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" type="button" data-close-modal aria-label="Fechar">×</button>
      <h2 id="confirmTitle">Confirmações</h2>
      <div id="confirmBody"></div>
    </div>
  </div>

  <script>
    const BASE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSXiQUm_GcKyup0R2ksKynxi-j7H9MHTCRqodZnsG8ImN0pdZva9c0VWvUHgUKRF1YWN3tswiZW_bmX/pub?gid=0&single=true&output=csv";
    const CONFIRM_URL = "https://script.google.com/macros/s/AKfycbz0SzAhkWcwH2K-0cfhl-e67W5jRCvHE6upLNK_GkR3WOlwVCKp3lG_3BRtVp8lKmtl/exec";
    const TARGET_ROLES = ["COORDENADOR", "PC", "YAMAHA", "CORTEX", "BERINGHER"];
    const WEEKDAYS = ["domingo", "segunda-feira", "terça-feira", "quarta-feira", "quinta-feira", "sexta-feira", "sábado"];
    const WEEKDAYS_SHORT = ["D", "S", "T", "Q", "Q", "S", "S"];

    let allRows = [];
    let activeRoleHeaders = [];
    let confirmations = [];
    let nextInfo = null;

    const ICONS = {
      PC: `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`,
      MIXER: `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>`,
      CORTEX: `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>`,
      HEADPHONES: `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>`,
      CAL: `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
      CLOCK: `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`
    };

    function getRoleIcon(role) {
      const r = role.toUpperCase();
      if (r === "PC") return ICONS.PC;
      if (r === "CORTEX") return ICONS.CORTEX;
      if (r === "BERINGHER") return ICONS.HEADPHONES;
      return ICONS.MIXER;
    }

    function parseCSVLine(line) {
      const res = []; let cur = "", inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') inQ = !inQ;
        else if (c === ',' && !inQ) { res.push(cur.trim()); cur = ""; }
        else cur += c;
      }
      res.push(cur.trim());
      return res;
    }

    function parseCSV(text) {
      const lines = text.replace(/^\uFEFF/, "").trim().split(/\r?\n/);
      if (lines.length < 2) return [];
      const rawHeaders = parseCSVLine(lines[0]).map(h => h.trim());
      activeRoleHeaders = [];
      TARGET_ROLES.forEach(t => {
        const found = rawHeaders.find(h => h.toUpperCase() === t);
        if (found) activeRoleHeaders.push(found);
      });
      return lines.slice(1).map(line => {
        const vals = parseCSVLine(line);
        const obj = { _raw: {} };
        rawHeaders.forEach((h, i) => {
          const v = (vals[i] || "").trim();
          obj[h.toUpperCase()] = v;
          obj._raw[h] = v;
        });
        return obj;
      });
    }

    function parseBRParts(str) {
      if (!str) return null;
      const p = str.split("/");
      if (p.length !== 3) return null;
      let y = Number(p[2]); if (y < 100) y += 2000;
      const m = Number(p[1]), d = Number(p[0]);
      return (y && m && d) ? { y, m, d } : null;
    }

    function parseBRDate(str) {
      const p = parseBRParts(str);
      return p ? new Date(p.y, p.m - 1, p.d, 23, 59, 59) : null;
    }

    function dayKey(p) { return `${p.y}-${p.m}-${p.d}`; }

    function formatYYYYMMDD(d) {
      return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
    }

    function buildGoogleCalendarLink(row, rowRoles) {
      const title = encodeURIComponent("Escala DESIL");
      const p = parseBRParts(row["DATA"]);
      let datesParam = "";
      if (p) {
        const start = new Date(p.y, p.m - 1, p.d);
        const end = new Date(start); end.setDate(end.getDate() + 1);
        datesParam = `&dates=${formatYYYYMMDD(start)}/${formatYYYYMMDD(end)}`;
      }
      const ev = row["EVENTO"] || "";
      const info = row["INFORMAÇÕES"] || row["INFORMACOES"] || row["INFORMAÇÃO"] || row["INFORMACAO"] || row["OBS"] || "";
      const team = rowRoles.map(r => `${r}: ${row._raw[r]}`).join("\n");
      const parts = [];
      if (ev) parts.push(`Evento: ${ev}`);
      if (info) parts.push(`Observações: ${info}`);
      parts.push(`Escalação:\n${team}`);
      return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}${datesParam}&details=${encodeURIComponent(parts.join("\n\n"))}`;
    }

    function switchTab(tab) {
      document.querySelectorAll("[data-tab]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tab);
      });
      document.getElementById("view-escalas").hidden = tab !== "escalas";
      document.getElementById("view-integrantes").hidden = tab !== "integrantes";
      if (tab === "integrantes") renderDirectory();
    }

    function populateFilter(rows) {
      const names = new Set();
      rows.forEach(r => activeRoleHeaders.forEach(role => { if (r._raw[role]) names.add(r._raw[role]); }));
      const select = document.getElementById("memberFilter");
      const sorted = Array.from(names).sort((a, b) => a.localeCompare(b, "pt-BR", { sensitivity: "base" }));
      sorted.forEach(name => {
        const opt = document.createElement("option");
        opt.value = name; opt.textContent = name;
        select.appendChild(opt);
      });
      const saved = localStorage.getItem("selectedMember");
      if (saved && sorted.includes(saved)) select.value = saved;
      select.addEventListener("change", (e) => {
        localStorage.setItem("selectedMember", e.target.value);
        renderAll();
      });
    }

    function keyOf(row) { return `${row["DATA"] || ""}|${row["EVENTO"] || ""}`; }
    function isConfirmed(key, name) { return confirmations.some(c => c.chave === key && c.nome === name); }
    function currentFilter() { return document.getElementById("memberFilter").value; }

    function renderMemberCalendars(memberRows, filterName, nextRow) {
      const box = document.getElementById("memberCalendars");
      if (filterName === "TODOS" || !memberRows.length) {
        box.innerHTML = "";
        return;
      }

      const scheduled = {};
      const months = new Map();
      memberRows.forEach(row => {
        const p = parseBRParts(row["DATA"]);
        if (!p) return;
        scheduled[dayKey(p)] = `card-${p.y}-${p.m}-${p.d}`;
        months.set(`${p.y}-${p.m}`, { y: p.y, m: p.m });
      });

      const nextParts = nextRow ? parseBRParts(nextRow["DATA"]) : null;
      const nextKey = nextParts ? dayKey(nextParts) : null;
      const t = new Date();
      const todayKey = dayKey({ y: t.getFullYear(), m: t.getMonth() + 1, d: t.getDate() });

      const sorted = Array.from(months.values()).sort((a, b) => (a.y - b.y) || (a.m - b.m));

      const html = sorted.map(({ y, m }) => {
        const firstDow = new Date(y, m - 1, 1).getDay();
        const daysInMonth = new Date(y, m, 0).getDate();
        const monthLabel = new Date(y, m - 1, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });

        let cells = WEEKDAYS_SHORT.map(l => `<div class="dow">${l}</div>`).join("");
        for (let i = 0; i < firstDow; i++) cells += `<div></div>`;
        for (let d = 1; d <= daysInMonth; d++) {
          const key = dayKey({ y, m, d });
          const targetId = scheduled[key];
          const cls = ["day", targetId ? "on" : "", key === nextKey ? "next" : "", key === todayKey ? "today" : ""].filter(Boolean).join(" ");
          cells += targetId
            ? `<div class="${cls}" data-card="${targetId}" title="Dia de escala">${d}</div>`
            : `<div class="${cls}">${d}</div>`;
        }
        return `<div class="month-card"><div class="month-name">${monthLabel}</div><div class="month-grid">${cells}</div></div>`;
      }).join("");

      box.innerHTML = `
        <div class="cal-section-title">Calendário de ${filterName}</div>
        ${html}
        <div class="legend"><span><i class="l-on"></i>Dia de escala</span><span><i class="l-next"></i>Próxima escala</span></div>
      `;
    }

    function renderAll() {
      const filterName = currentFilter();
      const container = document.getElementById("scheduleList");
      const filtered = filterName === "TODOS"
        ? allRows
        : allRows.filter(r => activeRoleHeaders.some(role => r._raw[role] === filterName));

      if (!filtered.length) {
        container.innerHTML = `<div class="empty">Nenhuma escala encontrada.</div>`;
        renderMemberCalendars([], filterName, null);
        return;
      }

      nextInfo = null;
      const now = new Date();
      let nextIndex = -1, minDiff = Infinity;
      filtered.forEach((row, idx) => {
        const d = parseBRDate(row["DATA"]);
        if (d && d >= now && (d - now) < minDiff) {
          minDiff = d - now; nextIndex = idx;
        }
      });

      container.innerHTML = filtered.map((row, idx) => {
        const isNext = idx === nextIndex;
        const rowKey = keyOf(row);
        const people = [...new Set(activeRoleHeaders.map(r => row._raw[r]).filter(Boolean))];
        if (isNext) {
          nextInfo = { key: rowKey, people, date: row["DATA"] || "" };
          const pendingCount = people.filter(p => !isConfirmed(rowKey, p)).length;
          document.getElementById("bellDot").style.display = pendingCount > 0 ? "block" : "none";
        }

        const mark = (person) => (isNext && CONFIRM_URL && isConfirmed(rowKey, person)) ? '<span class="chk">✓</span>' : "";
        const nConf = people.filter(p => isConfirmed(rowKey, p)).length;
        const rowRoles = activeRoleHeaders.filter(role => row._raw[role]);
        const isUserScheduled = filterName !== "TODOS" && rowRoles.some(r => row._raw[r] === filterName);

        const p = parseBRParts(row["DATA"]);
        const wd = p ? WEEKDAYS[new Date(p.y, p.m - 1, p.d).getDay()] : "";
        const cardId = p ? `card-${p.y}-${p.m}-${p.d}` : "";
        const infoText = row["INFORMAÇÕES"] || row["INFORMACOES"] || row["INFORMAÇÃO"] || row["INFORMACAO"] || row["OBS"] || "";

        const coordCol = rowRoles.find(r => r.toUpperCase() === "COORDENADOR");
        const otherRoles = rowRoles.filter(r => r.toUpperCase() !== "COORDENADOR");

        let rolesHTML = "";
        if (coordCol) {
          const cp = row._raw[coordCol];
          rolesHTML += `
            <div class="coord-banner">
              <small>Coordenador</small>
              <strong>${cp}${mark(cp)}</strong>
            </div>
          `;
        }

        if (otherRoles.length === 1 && !coordCol) {
          const r = otherRoles[0], person = row._raw[r];
          rolesHTML += `
            <div class="single-role-row">
              <div class="single-role-left">${getRoleIcon(r)} ${r}</div>
              <strong>${person}${mark(person)}</strong>
            </div>
          `;
        } else if (otherRoles.length > 0) {
          rolesHTML += `<div class="roles-grid">` + otherRoles.map(role => {
            const person = row._raw[role];
            const isMe = person === filterName;
            return `
              <div class="role-tile ${isMe ? "me" : ""}">
                ${getRoleIcon(role)}
                <div class="role-tile-text">
                  <small>${role}</small>
                  <strong>${person}${mark(person)}</strong>
                </div>
              </div>
            `;
          }).join("") + `</div>`;
        }

        return `
          <div class="card ${isNext ? "next-up" : (isUserScheduled ? "highlight" : "")}" id="${cardId}">
            ${isNext ? `
              <div class="card-badges">
                <span class="next-pill">★ Próxima Escala</span>
                <span class="event-pill">${row["EVENTO"] || "Culto"}</span>
              </div>
            ` : ""}
            <div class="card-date-row">
              <div>
                <div class="date-main">
                  ${ICONS.CAL}
                  <span class="date-str">${row["DATA"] || ""}</span>
                  ${isNext && wd ? `<span class="weekday-str">${wd}</span>` : ""}
                </div>
                ${!isNext && wd ? `<div class="weekday-sub">${wd}</div>` : ""}
              </div>
              ${!isNext ? `<span class="event-pill">${row["EVENTO"] || "Culto"}</span>` : ""}
            </div>
            ${infoText ? `<div class="info-strip">${ICONS.CLOCK}<span>${infoText}</span></div>` : ""}
            ${rolesHTML}
            ${isNext && CONFIRM_URL ? `
              <button type="button" class="confirm-btn" data-open-confirm>
                ✓ Confirmar presença <span class="count-badge">${nConf}/${people.length}</span>
              </button>
            ` : ""}
            <a href="${buildGoogleCalendarLink(row, rowRoles)}" target="_blank" rel="noopener" class="gcal-btn">
              📅 Adicionar ao Google Agenda
            </a>
          </div>
        `;
      }).join("");

      renderMemberCalendars(filtered, filterName, nextIndex >= 0 ? filtered[nextIndex] : null);
    }

    function renderDirectory() {
      const counts = new Map();
      allRows.forEach(r => {
        activeRoleHeaders.forEach(role => {
          const name = r._raw[role];
          if (name) counts.set(name, (counts.get(name) || 0) + 1);
        });
      });
      const sorted = Array.from(counts.entries()).sort((a, b) => a[0].localeCompare(b[0], "pt-BR"));
      document.getElementById("membersDirectory").innerHTML = sorted.map(([name, qty]) => `
        <div class="member-row" data-pick-member="${name}">
          <strong>${name}</strong>
          <span class="member-badge">${qty} ${qty === 1 ? "escala" : "escalas"}</span>
        </div>
      `).join("");
    }

    function loadConfirmations() {
      fetch(`${CONFIRM_URL}?t=${Date.now()}`)
        .then(r => r.json())
        .then(data => { if (Array.isArray(data)) { confirmations = data; renderAll(); refreshModal(); } })
        .catch(() => {});
    }

    function openConfirmModal() {
      if (!nextInfo) return;
      document.getElementById("confirmModal").hidden = false;
      refreshModal();
    }

    function refreshModal() {
      const modal = document.getElementById("confirmModal");
      if (modal.hidden || !nextInfo) return;
      const { key, people, date } = nextInfo;
      document.getElementById("confirmTitle").textContent = `Confirmações — ${date}`;
      const items = people.map(p => {
        const c = confirmations.find(c => c.chave === key && c.nome === p);
        return `<li class="${c ? "ok" : ""}"><span>${p}</span><span>${c ? "✓ Confirmado" : "Pendente"}</span></li>`;
      }).join("");
      const pending = people.filter(p => !isConfirmed(key, p));
      const sel = currentFilter();
      const form = pending.length
        ? `<select id="confirmName">${pending.map(p => `<option value="${p}" ${p === sel ? "selected" : ""}>${p}</option>`).join("")}</select>
           <button type="button" class="confirm-submit" id="confirmSubmit">Confirmar minha presença</button>`
        : `<p style="text-align:center; font-size:0.85rem; color:var(--accent); font-weight:700;">Toda a equipe confirmada! 🎉</p>`;
      document.getElementById("confirmBody").innerHTML = `<ul class="confirm-list">${items}</ul>${form}`;
    }

    document.addEventListener("click", (e) => {
      const tabBtn = e.target.closest("[data-tab]");
      if (tabBtn) switchTab(tabBtn.dataset.tab);

      if (e.target.closest("[data-open-confirm]")) openConfirmModal();
      if (e.target.closest("[data-close-modal]") || e.target.id === "confirmModal") {
        document.getElementById("confirmModal").hidden = true;
      }

      const calDay = e.target.closest(".day.on");
      if (calDay) {
        const card = document.getElementById(calDay.dataset.card);
        if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });
      }

      const pick = e.target.closest("[data-pick-member]");
      if (pick) {
        const sel = document.getElementById("memberFilter");
        sel.value = pick.dataset.pickMember;
        localStorage.setItem("selectedMember", sel.value);
        switchTab("escalas");
        renderAll();
      }

      if (e.target.id === "confirmSubmit") {
        const name = document.getElementById("confirmName").value;
        e.target.disabled = true; e.target.textContent = "Enviando...";
        fetch(`${CONFIRM_URL}?action=confirm&chave=${encodeURIComponent(nextInfo.key)}&nome=${encodeURIComponent(name)}`)
          .then(r => r.json())
          .then(data => { if (Array.isArray(data)) { confirmations = data; renderAll(); refreshModal(); } });
      }
    });

    fetch(`${BASE_CSV_URL}&t=${Date.now()}`)
      .then(res => res.text())
      .then(csv => {
        allRows = parseCSV(csv).filter(r => r["DATA"]);
        populateFilter(allRows);
        renderAll();
        if (CONFIRM_URL) loadConfirmations();
      })
      .catch(() => {
        document.getElementById("scheduleList").innerHTML = `<div class="empty">Erro ao carregar planilha.</div>`;
      });
  </script>
</body>
</html>
